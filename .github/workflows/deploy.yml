name: Deploy to Cloudflare Pages
# Migración 2026-09: el sitio pasa de GitHub Pages a Cloudflare Pages (301 reales vía public/_redirects,
# formulario vía Pages Functions). Requiere los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en el repo.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'LICENSE*'
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency:
  group: "cf-pages-cadeca"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restaurar cache de Astro
        id: astro-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules/.astro
            .astro
          key: astro-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            astro-${{ hashFiles('package-lock.json') }}-
            astro-
      - run: npm run build
      - name: Guardar cache de Astro
        if: steps.astro-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules/.astro
            .astro
          key: ${{ steps.astro-cache.outputs.cache-primary-key }}
      # Huella del commit dentro del artefacto publicado (el gate la pide al dominio).
      - name: Sellar build-id
        run: echo "${{ github.sha }}" > dist/build-id.txt
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 pages project create cadeca --production-branch=main 2>/dev/null || true
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cadeca --branch=main --commit-dirty=true
      # ─── GATE REAL: verifica el DOMINIO, no el build ───
      - name: Verificar que el dominio sirve este commit
        run: |
          DOMINIO="cajas-de-carton.com"
          for i in $(seq 1 12); do
            sleep 10
            LIVE=$(curl -fsSL --max-time 15 "https://$DOMINIO/build-id.txt?cb=${RANDOM}${i}" 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ "$LIVE" = "${{ github.sha }}" ]; then
              echo "OK — $DOMINIO sirve ${GITHUB_SHA:0:12}"
              exit 0
            fi
            echo "intento $i/12 — el dominio devuelve '${LIVE:0:12}', esperado '${GITHUB_SHA:0:12}'"
          done
          echo "::error::$DOMINIO NO sirve este build tras 2 min (revisar custom domain del proyecto Pages, DNS y que GitHub Pages esté desactivado)."
          exit 1
