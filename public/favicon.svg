<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6A00"/>
      <stop offset="100%" style="stop-color:#E05800"/>
    </linearGradient>
  </defs>

  <!-- Fondo naranja con esquinas redondeadas -->
  <rect width="64" height="64" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Caja de cartón estilizada en blanco -->
  <!-- Cuerpo de la caja -->
  <rect x="11" y="26" width="42" height="28" rx="2" ry="2"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Solapa izquierda -->
  <path d="M11 26 L11 16 Q11 14 13 14 L26 14 L26 26"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Solapa derecha -->
  <path d="M53 26 L53 16 Q53 14 51 14 L38 14 L38 26"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Línea central de solapas -->
  <line x1="32" y1="14" x2="32" y2="26"
        stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Líneas de corrugado (3 líneas horizontales dentro) -->
  <line x1="14" y1="34" x2="50" y2="34"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="14" y1="40" x2="50" y2="40"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="14" y1="46" x2="50" y2="46"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
